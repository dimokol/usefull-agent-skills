# Codex: append to ~/.codex/config.toml (the installer does this with --codex).
# Replace the two absolute paths. tool_timeout_sec is raised so a long wait() is
# not killed by Codex's 60s default; default_tools_approval_mode covers every tool
# this server exposes so post/wait don't prompt each call.
[mcp_servers.agent_chat]
command = "node"
args = ["/absolute/path/to/mcp/agent-chat/server.mjs"]
startup_timeout_sec = 10
tool_timeout_sec = 3600
default_tools_approval_mode = "approve"
enabled = true

[mcp_servers.agent_chat.env]
AGENT_CHAT_DIR = "/absolute/path/to/your-project/.agent-chat"
